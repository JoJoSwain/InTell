name: CI

on:
  push:
    branches: [master]
  pull_request:

# One group per PR (pull_request.number) and per branch for master pushes.
# A newer push cancels the in-progress run so two supabase stacks never race
# on the same runner's fixed host ports (54324…).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager" (do not also set with.version).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Export the mobile bundle (no secrets)
        run: |
          OUT=$(mktemp -d)
          pnpm --filter @intell/mobile exec expo export --platform android --output-dir "$OUT"
      - run: pnpm --filter @intell/admin build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check-edge-shared
      # seed-tones/ is gitignored; generate before upload in db:setup-local
      - run: pnpm db:seed-media-meta
      # Fail if regenerated shas/bytes diverge from committed metadata (Windows vs Linux)
      - run: git diff --exit-code supabase/seed-media.json
      # Clear any leftover containers/ports from a cancelled prior attempt on this VM.
      - run: pnpm exec supabase stop --no-backup || true
      - run: pnpm exec supabase start
      - name: Setup local DB + Vault + seed media
        env:
          # In-network URL for pg_net from the DB container (verify empirically)
          RUN_JOBS_URL: http://host.docker.internal:54321/functions/v1/run-jobs
        run: pnpm db:setup-local
      - name: Serve edge functions (per-function verify_jwt from config.toml)
        run: pnpm exec supabase functions serve &
      - name: Wait for functions
        run: |
          eval "$(pnpm exec supabase status -o env)"
          KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          export KEY
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:54321/functions/v1/run-jobs" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}" \
              -H "Content-Type: application/json" \
              -d '{}' || true)
            if echo "$code" | grep -qE '200|401|403|405'; then
              exit 0
            fi
            sleep 2
          done
          echo "functions not ready"; exit 1
      - run: pnpm exec supabase test db
      - run: pnpm test:integration
      - name: Playwright M3b smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: |
          eval "$(pnpm exec supabase status -o env)"
          PUB="${PUBLISHABLE_KEY:-$ANON_KEY}"
          SEC="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUB"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$PUB"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$PUB"
          export SUPABASE_SERVICE_ROLE_KEY="$SEC"
          export SECRET_KEY="$SEC"
          export PUBLISHABLE_KEY="$PUB"
          pnpm --filter @intell/admin test:e2e:install
          pnpm --filter @intell/admin e2e:prepare
          pnpm --filter @intell/admin test:e2e
