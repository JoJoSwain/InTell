name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager" (do not also set with.version).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @intell/admin build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check-edge-shared
      - run: pnpm exec supabase start
      - name: Setup local DB + Vault + seed media
        env:
          # In-network URL for pg_net from the DB container (verify empirically)
          RUN_JOBS_URL: http://host.docker.internal:54321/functions/v1/run-jobs
        run: pnpm db:setup-local
      - name: Serve edge functions
        run: pnpm exec supabase functions serve --no-verify-jwt &
      - name: Wait for functions
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:54321/functions/v1/run-jobs" -X OPTIONS >/dev/null 2>&1 \
              || curl -sf -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:54321/functions/v1/run-jobs" \
                -H "Authorization: Bearer $SERVICE_ROLE_KEY" -H "Content-Type: application/json" -d '{}' \
                | grep -qE '200|401|403|405'; then
              exit 0
            fi
            sleep 2
          done
          echo "functions not ready"; exit 1
        env:
          SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      - run: pnpm exec supabase test db
      - run: pnpm test:integration
